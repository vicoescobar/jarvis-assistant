services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jarvis-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PROXY_HOPS=1
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,crypto,http,https,url
      - N8N_RUNNERS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - DISCORD_BRIEFING_WEBHOOK_URL=${DISCORD_BRIEFING_WEBHOOK_URL:-}
      - DISCORD_VOICE_LOG_WEBHOOK_URL=${DISCORD_VOICE_LOG_WEBHOOK_URL:-}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./user_data:/home/node/user_data
      - ../workflows:/home/node/workflows

  discord-bridge:
    build:
      context: ../scripts/discord-bridge
      dockerfile: Dockerfile
    container_name: jarvis-discord-bridge
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      - TZ=${TZ:-Europe/Paris}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CHATBOT_CHANNEL_ID=${DISCORD_CHATBOT_CHANNEL_ID:-}
      - N8N_CHATBOT_WEBHOOK_URL=http://jarvis-n8n:5678/webhook/discord-chat

  jarvis-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      - n8n
    environment:
      - TZ=${TZ:-Europe/Paris}
      - APP_NAME=Jarvis
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${BACKEND_APP_KEY:-}
      - APP_URL=${BACKEND_APP_URL:-https://jarvis-api.victor-giroud.fr}
      - FRONTEND_URL=${FRONTEND_URL:-https://jarvis-dashboard.victor-giroud.fr}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/storage/app/sqlite/database.sqlite
      - JARVIS_OWNER_EMAIL=${JARVIS_OWNER_EMAIL:-}
      - JARVIS_OWNER_PASSWORD=${JARVIS_OWNER_PASSWORD:-}
      - N8N_INTERNAL_URL=http://jarvis-n8n:5678
      - USER_DATA_PATH=/var/www/user_data
    volumes:
      - ./user_data:/var/www/user_data
      - ./backend_data:/var/www/storage/app/sqlite
